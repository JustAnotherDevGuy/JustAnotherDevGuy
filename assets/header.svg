<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JustAnotherDevGuy profile header</title>
  <desc id="desc">Minimal backend and infrastructure themed header with safe spacing and subtle motion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111A"/>
      <stop offset="0.52" stop-color="#0C1623"/>
      <stop offset="1" stop-color="#0A0F17"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111C2C"/>
      <stop offset="1" stop-color="#0E1724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4CC9FF"/>
      <stop offset="1" stop-color="#57F2A3"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#16304A" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="28" fill="url(#grid)" opacity="0.33"/>

  <g opacity="0.22">
    <path d="M0 130H1600" stroke="#16304A"/>
    <path d="M0 292H1600" stroke="#16304A"/>
    <path d="M892 0V520" stroke="#16304A"/>
  </g>

  <g>
    <rect x="56" y="56" width="836" height="406" rx="24" fill="url(#panel)" stroke="#254262"/>
    <rect x="56" y="56" width="836" height="48" rx="24" fill="#162235"/>
    <circle cx="90" cy="80" r="6" fill="#FF5F57"/>
    <circle cx="118" cy="80" r="6" fill="#FEBC2E"/>
    <circle cx="146" cy="80" r="6" fill="#28C840"/>
    <text x="180" y="86" fill="#90A9CC" font-family="monospace" font-size="16">operator@justanotherdevguy</text>

    <text x="92" y="164" fill="#E8F1FC" font-family="monospace" font-size="30">backend systems engineer</text>
    <text x="92" y="220" fill="#69F0AE" font-family="monospace" font-size="64" font-weight="700">ship code</text>
    <text x="92" y="286" fill="#69F0AE" font-family="monospace" font-size="64" font-weight="700">keep it up</text>
    <text x="92" y="344" fill="#9CB7DA" font-family="monospace" font-size="22">go  •  typescript  •  kubernetes</text>
    <text x="92" y="382" fill="#9CB7DA" font-family="monospace" font-size="22">gitops  •  observability</text>

    <g transform="translate(92 438)">
      <rect width="264" height="18" rx="9" fill="#122033" stroke="#22415F"/>
      <path d="M12 9H252" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
        <animate attributeName="stroke-dasharray" values="0 240;120 120;240 0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <g transform="translate(956 70)">
    <rect width="586" height="184" rx="22" fill="url(#panel)" stroke="#254262"/>
    <text x="32" y="46" fill="#E8F1FC" font-family="monospace" font-size="21">footprint</text>

    <rect x="32" y="72" width="230" height="84" rx="16" fill="#132033" stroke="#2A4768"/>
    <text x="54" y="103" fill="#69F0AE" font-family="monospace" font-size="20">de-fsn</text>
    <text x="54" y="126" fill="#9CB7DA" font-family="monospace" font-size="14">
      <tspan x="54" dy="0">core region</tspan>
      <tspan x="54" dy="18">proxmox</tspan>
    </text>

    <rect x="324" y="72" width="230" height="84" rx="16" fill="#132033" stroke="#2A4768"/>
    <text x="346" y="103" fill="#69F0AE" font-family="monospace" font-size="20">nl-edge</text>
    <text x="346" y="126" fill="#9CB7DA" font-family="monospace" font-size="14">
      <tspan x="346" dy="0">edge region</tspan>
      <tspan x="346" dy="18">ingress</tspan>
    </text>

    <path d="M262 104H324" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(956 274)">
    <rect width="586" height="112" rx="22" fill="url(#panel)" stroke="#254262"/>
    <text x="32" y="44" fill="#E8F1FC" font-family="monospace" font-size="21">delivery</text>
    <text x="32" y="73" fill="#BFD0E6" font-family="monospace" font-size="16">
      <tspan x="32" dy="0">push  →  reconcile</tspan>
      <tspan x="32" dy="24">release  →  rollout</tspan>
    </text>
  </g>

  <g transform="translate(956 404)">
    <rect width="586" height="116" rx="22" fill="url(#panel)" stroke="#254262"/>
    <text x="32" y="40" fill="#E8F1FC" font-family="monospace" font-size="21">focus</text>
    <text x="32" y="67" fill="#9CB7DA" font-family="monospace" font-size="15">
      <tspan x="32" dy="0">typed services</tspan>
      <tspan x="32" dy="22">recoverable infra</tspan>
    </text>
  </g>
</svg>
