<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cluster architecture diagram</title>
  <desc id="desc">Minimal systems architecture diagram showing source control, reconciliation, two regional nodes, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A101A"/>
      <stop offset="1" stop-color="#101A28"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#48C7FF"/>
      <stop offset="1" stop-color="#57F2A3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#17304A" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="28" fill="url(#grid)" opacity="0.22"/>
  <text x="60" y="66" fill="#E8F1FC" font-family="monospace" font-size="30">multi-location topology</text>
  <text x="60" y="98" fill="#8FAACC" font-family="monospace" font-size="17">gitops  •  regional split  •  observability</text>

  <rect x="72" y="156" width="276" height="140" rx="20" fill="#111C2C" stroke="#274565"/>
  <text x="102" y="198" fill="#69F0AE" font-family="monospace" font-size="28">github</text>
  <text x="102" y="232" fill="#D2DEEF" font-family="monospace" font-size="20">source</text>
  <text x="102" y="266" fill="#98B2D3" font-family="monospace" font-size="16">manifests</text>

  <rect x="436" y="156" width="292" height="140" rx="20" fill="#111C2C" stroke="#274565"/>
  <text x="466" y="198" fill="#69F0AE" font-family="monospace" font-size="28">fluxcd</text>
  <text x="466" y="232" fill="#D2DEEF" font-family="monospace" font-size="19">reconcile</text>
  <text x="466" y="266" fill="#98B2D3" font-family="monospace" font-size="16">sync</text>

  <rect x="836" y="136" width="252" height="194" rx="20" fill="#111C2C" stroke="#274565"/>
  <text x="864" y="180" fill="#69F0AE" font-family="monospace" font-size="24">germany</text>
  <text x="864" y="214" fill="#D2DEEF" font-family="monospace" font-size="17">core region</text>
  <text x="864" y="246" fill="#98B2D3" font-family="monospace" font-size="16">talos</text>
  <text x="864" y="274" fill="#98B2D3" font-family="monospace" font-size="15">
    <tspan x="864" dy="0">stateful</tspan>
    <tspan x="864" dy="20">control</tspan>
    </text>

  <rect x="1184" y="136" width="252" height="194" rx="20" fill="#111C2C" stroke="#274565"/>
  <text x="1212" y="180" fill="#69F0AE" font-family="monospace" font-size="24">netherlands</text>
  <text x="1212" y="214" fill="#D2DEEF" font-family="monospace" font-size="17">edge region</text>
  <text x="1212" y="246" fill="#98B2D3" font-family="monospace" font-size="16">talos</text>
  <text x="1212" y="274" fill="#98B2D3" font-family="monospace" font-size="15">
    <tspan x="1212" dy="0">ingress</tspan>
    <tspan x="1212" dy="20">isolation</tspan>
    </text>

  <rect x="436" y="408" width="600" height="128" rx="20" fill="#111C2C" stroke="#274565"/>
  <text x="468" y="444" fill="#69F0AE" font-family="monospace" font-size="26">observability</text>
  <text x="468" y="478" fill="#D2DEEF" font-family="monospace" font-size="19">metrics + logs</text>
  <text x="468" y="506" fill="#98B2D3" font-family="monospace" font-size="15">
    <tspan x="468" dy="0">health across</tspan>
    <tspan x="468" dy="20">both regions</tspan>
    </text>

  <g opacity="0.18">
    <path d="M854 126V330" stroke="#22405E"/>
    <path d="M1214 126V330" stroke="#22405E"/>
    <path d="M60 360H1540" stroke="#22405E"/>
  </g>

  <g filter="url(#glow)">
    <path d="M348 226H436" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M728 226H782V116H962V136" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.3s" repeatCount="indefinite"/>
    </path>
    <path d="M728 226H782V116H1310V136" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M962 330V408" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1310 330V378H1036" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
