<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cluster architecture diagram</title>
  <desc id="desc">Animated diagram showing a Germany node, a Netherlands node, GitHub, FluxCD, and observability flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A101A"/>
      <stop offset="1" stop-color="#101B2A"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" fill="#E8F1FC" font-family="monospace" font-size="30">multi-location homelab / gitops topology</text>
  <text x="60" y="96" fill="#8AA4C7" font-family="monospace" font-size="18">declarative delivery, split failure domains, shared observability</text>

  <rect x="76" y="148" width="270" height="140" rx="18" fill="#0F1B2D" stroke="#24415D"/>
  <text x="104" y="190" fill="#74F0B4" font-family="monospace" font-size="26">github</text>
  <text x="104" y="224" fill="#C3D4E8" font-family="monospace" font-size="18">source of truth</text>
  <text x="104" y="252" fill="#8AA4C7" font-family="monospace" font-size="16">manifests, charts, automation</text>

  <rect x="458" y="148" width="270" height="140" rx="18" fill="#0F1B2D" stroke="#24415D"/>
  <text x="486" y="190" fill="#74F0B4" font-family="monospace" font-size="26">fluxcd</text>
  <text x="486" y="224" fill="#C3D4E8" font-family="monospace" font-size="18">continuous reconciliation</text>
  <text x="486" y="252" fill="#8AA4C7" font-family="monospace" font-size="16">drift detection and rollout control</text>

  <rect x="870" y="128" width="296" height="184" rx="18" fill="#0F1B2D" stroke="#24415D"/>
  <text x="898" y="170" fill="#74F0B4" font-family="monospace" font-size="24">germany</text>
  <text x="898" y="200" fill="#C3D4E8" font-family="monospace" font-size="18">dedicated server / proxmox vm</text>
  <text x="898" y="236" fill="#8AA4C7" font-family="monospace" font-size="16">talos linux</text>
  <text x="898" y="262" fill="#8AA4C7" font-family="monospace" font-size="16">stateful workloads</text>
  <text x="898" y="288" fill="#8AA4C7" font-family="monospace" font-size="16">core services and cluster control</text>

  <rect x="1228" y="128" width="296" height="184" rx="18" fill="#0F1B2D" stroke="#24415D"/>
  <text x="1256" y="170" fill="#74F0B4" font-family="monospace" font-size="24">netherlands</text>
  <text x="1256" y="200" fill="#C3D4E8" font-family="monospace" font-size="18">vps / edge capacity</text>
  <text x="1256" y="236" fill="#8AA4C7" font-family="monospace" font-size="16">talos linux</text>
  <text x="1256" y="262" fill="#8AA4C7" font-family="monospace" font-size="16">ingress and public routing</text>
  <text x="1256" y="288" fill="#8AA4C7" font-family="monospace" font-size="16">failure-domain separation</text>

  <rect x="458" y="370" width="620" height="122" rx="18" fill="#0F1B2D" stroke="#24415D"/>
  <text x="490" y="414" fill="#74F0B4" font-family="monospace" font-size="24">observability</text>
  <text x="490" y="446" fill="#C3D4E8" font-family="monospace" font-size="18">prometheus + grafana + logs</text>
  <text x="490" y="474" fill="#8AA4C7" font-family="monospace" font-size="16">measure rollout impact, node health, workload behavior</text>

  <g filter="url(#softGlow)">
    <path d="M346 218H458" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M728 218H870" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M728 218H1228" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="3.1s" repeatCount="indefinite"/>
    </path>
    <path d="M1018 312V370" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1376 312V370H1078" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
