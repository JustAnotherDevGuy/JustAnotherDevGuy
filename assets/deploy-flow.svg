<svg width="1600" height="320" viewBox="0 0 1600 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Deployment flow diagram</title>
  <desc id="desc">Minimal deployment flow showing push, reconcile, release, and observe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A101A"/>
      <stop offset="1" stop-color="#0E1724"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#48C7FF"/>
      <stop offset="1" stop-color="#57F2A3"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="320" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#E8F1FC" font-family="monospace" font-size="28">deployment flow</text>
  <text x="60" y="94" fill="#8FAACC" font-family="monospace" font-size="17">push  •  reconcile  •  release  •  observe</text>

  <g transform="translate(58 146)">
    <rect width="320" height="120" rx="18" fill="#111C2C" stroke="#274565"/>
    <text x="28" y="44" fill="#69F0AE" font-family="monospace" font-size="24">1. git push</text>
    <text x="28" y="76" fill="#AFC3DE" font-family="monospace" font-size="16">
      <tspan x="28" dy="0">source</tspan>
      <tspan x="28" dy="20">repo</tspan>
    </text>
  </g>

  <g transform="translate(410 146)">
    <rect width="320" height="120" rx="18" fill="#111C2C" stroke="#274565"/>
    <text x="28" y="44" fill="#69F0AE" font-family="monospace" font-size="24">2. flux reconcile</text>
    <text x="28" y="76" fill="#AFC3DE" font-family="monospace" font-size="16">
      <tspan x="28" dy="0">drift</tspan>
      <tspan x="28" dy="20">sync</tspan>
    </text>
  </g>

  <g transform="translate(762 146)">
    <rect width="320" height="120" rx="18" fill="#111C2C" stroke="#274565"/>
    <text x="28" y="44" fill="#69F0AE" font-family="monospace" font-size="24">3. helm release</text>
    <text x="28" y="76" fill="#AFC3DE" font-family="monospace" font-size="16">
      <tspan x="28" dy="0">chart</tspan>
      <tspan x="28" dy="20">apply</tspan>
    </text>
  </g>

  <g transform="translate(1114 146)">
    <rect width="428" height="120" rx="18" fill="#111C2C" stroke="#274565"/>
    <text x="28" y="44" fill="#69F0AE" font-family="monospace" font-size="24">4. rolling deploy + observe</text>
    <text x="28" y="76" fill="#AFC3DE" font-family="monospace" font-size="16">
      <tspan x="28" dy="0">health</tspan>
      <tspan x="28" dy="20">metrics</tspan>
    </text>
  </g>

  <g filter="url(#glow)">
    <path d="M378 206H410" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M730 206H762" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M1082 206H1114" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
